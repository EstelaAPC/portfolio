<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carregando...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            overflow: hidden;
        }

        .language-selector {
            position: absolute;
            top: 2rem;
            right: 2rem;
            display: flex;
            gap: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            z-index: 10;
        }

        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            position: relative;
            z-index: 5;
        }

        .language-selector a {
            cursor: pointer;
            text-decoration: none;
            color: #999;
            transition: color 0.3s ease;
        }

        .language-selector a.active {
            color: #333;
        }

        .language-selector a:hover {
            color: #333;
        }

        .language-selector span {
            color: #ccc;
        }

        .loader-gif {
            width: 400px;
            height: 400px;
            background-color: #f5f5f5;
            border-radius: 8px;
        }

        .loader-text {
            font-size: 1.1rem;
            color: #666;
            font-weight: 300;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .progress-bar-container {
            width: 300px;
            height: 4px;
            background-color: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-bar {
            height: 100%;
            background-color: #53316e;
            width: 0%;
            animation: progress 2s ease-in-out forwards;
        }

        @keyframes progress {
            0% {
                width: 0%;
            }
            50% {
                width: 70%;
            }
            100% {
                width: 100%;
            }
        }

        @media (max-width: 640px) {
            .language-selector {
                top: 1rem;
                right: 1rem;
                font-size: 0.8rem;
            }

            .loader-gif {
                width: 300px;
                height: 300px;
            }

            .progress-bar-container {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="language-selector">
        <a href="#" class="lang-link active" data-lang="pt">PT</a>
        <span>/</span>
        <a href="#" class="lang-link" data-lang="en">EN</a>
    </div>

    <div class="loader-container">
        <video class="loader-gif" autoplay muted playsinline>
            <source src="assets/loader.mp4" type="video/mp4">
            Seu navegador não suporta vídeo HTML5
        </video>
        <p class="loader-text" data-i18n="loading">Carregando...</p>
        <div class="progress-bar-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <script src="translations.js"></script>
    <script>
        // Debug video loading
        const video = document.querySelector('video');
        video.addEventListener('loadstart', () => console.log('Video loadstart'));
        video.addEventListener('canplay', () => console.log('Video can play'));
        video.addEventListener('error', (e) => console.error('Video error:', e));

        // Redireciona para a página inicial após 2 segundos
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 2000);
    </script>
</body>
</html>
